extra:
  version:
    provider: mike
  generator: false

nav:
  - Home: index.md

  - Getting started:
    - Package contents: getting_started/Package_content.md
    - Unboxing guide: getting_started/Unboxing.md
    - Connection guide: getting_started/Connection_guide.md
    - Terminology: how_to/terminology.md
    - System comparison: Systems_comparison.md

  - How to use it:
    - User interface: how_to/Screen-layout.md
    - Inspection workflow: how_to/Inspection_workflow.md
    - Settings menu: how_to/Settings_menu.md
    - Tips: help/Tips.md
    - Inspection tools:
      - Sensitivity: how_to/Set_sensitivity.md
      - Exclusion area: how_to/Set_exclusion_area.md
      - Workspace icons: how_to/Workspace_icons.md
      - UUI to REFERENCE: how_to/UUI_to_REFERENCE.md
      - Measurement tool: features/Measurement_tool.md
      - Manual alignment: features/Manual_alignment.md
    - Advanced features:
      - Barcode reader: features/Barcode_reader.md
      - Reference variants: features/Multivariant_feature.md
      - Custom sequences: features/Custom_sequences.md
      - UV conformal coating inspection: features/UV_conformal_coating_inspection.md
      - User access control: features/User_control.md

  - Support:
    - Maintenance: maintenance/maintenance.md
    - Update software: maintenance/update_software.md
    - Troubleshooting: maintenance/Troubleshooting.md
    - Installation procedures:
      - UV coating kit installation: maintenance/UV_kit_install.md
      - Production line integration: maintenance/Conveyor_integration.md
      - Network interface configuration: maintenance/network_configuration.md

  - Additional information:
    - FAQ: help/FAQ.md

copyright: Copyright &copy; 2023 - 2025 AgnosPCB

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - toc:
      permalink: true
  # Enables :material-*: / :octicons-*: icons used in the home page cards
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
